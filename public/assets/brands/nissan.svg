    <path d="M 28 80 C 34 46 64 20 100 20 C 136 20 166 46 172 80 L 154 80 C 148 54 126 36 100 36 C 74 36 52 54 46 80 Z" fill="url(#nissanChrome)"/>
    <path d="M 28 100 C 34 134 64 160 100 160 C 136 160 166 134 172 100 L 154 100 C 148 126 126 144 100 144 C 74 144 52 126 46 100 Z" fill="url(#nissanChrome)"/>
    <!-- Central NISSAN Bar -->
    <rect x="12" y="80" width="176" height="20" rx="3" fill="url(#nissanRed)"/>
    <text x="100" y="95" font-family="sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">NISSAN</text>
  </g>
</svg>
