<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nissanRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C3002F" />
      <stop offset="100%" stop-color="#990024" />
    </linearGradient>
    <linearGradient id="nissanChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  <!-- Official Nissan Circle & Bar Emblem -->
  <g transform="translate(15, 20) scale(0.85)">
