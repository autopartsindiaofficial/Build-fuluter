<svg viewBox="0 0 1080 2400" width="1080" height="2400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700&amp;family=Plus+Jakarta+Sans:wght@500;700&amp;display=swap');
      .title-text {
        font-family: 'Fredoka', 'Nunito', 'Arial Rounded MT Bold', sans-serif;
        font-weight: 700;
        font-size: 154px;
        fill: #FFFFFF;
      }
      .india-text {
        font-family: 'Plus Jakarta Sans', 'Arial', sans-serif;
        font-weight: 700;
        font-size: 40px;
        fill: #FFFFFF;
        letter-spacing: 26px;
      }
      .tagline-text {
        font-family: 'Plus Jakarta Sans', 'Arial', sans-serif;
        font-weight: 500;
        font-size: 36px;
        fill: #FFFFFF;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1080" height="2400" fill="#0075FF" />

  <!-- CENTER LOGO GROUP (Centered around y = 1140) -->
  <g transform="translate(540, 1120)">
    <!-- GEAR IN UPPER RIGHT BEHIND CAR -->
    <g transform="translate(112, -196)" fill="#FFFFFF">
      <!-- 8 Rounded Chunky Teeth -->
      <rect x="-24" y="-152" width="48" height="44" rx="16" />
      <rect x="-24" y="-152" width="48" height="44" rx="16" transform="rotate(45)" />
      <rect x="-24" y="-152" width="48" height="44" rx="16" transform="rotate(90)" />
      <rect x="-24" y="-152" width="48" height="44" rx="16" transform="rotate(135)" />
      <rect x="-24" y="-152" width="48" height="44" rx="16" transform="rotate(180)" />
      <rect x="-24" y="-152" width="48" height="44" rx="16" transform="rotate(225)" />
      <rect x="-24" y="-152" width="48" height="44" rx="16" transform="rotate(270)" />
      <rect x="-24" y="-152" width="48" height="44" rx="16" transform="rotate(315)" />

      <!-- Gear Outer Ring Body -->
      <circle cx="0" cy="0" r="128" fill="#FFFFFF" />
      <!-- Gear Center Cutout Hole (matches background) -->
      <circle cx="0" cy="0" r="76" fill="#0075FF" />
    </g>

    <!-- CAR FRONT SILHOUETTE (Solid White) -->
    <g fill="#FFFFFF" transform="translate(0, -210)">
      <!-- Side Mirrors -->
      <rect x="-192" y="50" width="52" height="24" rx="12" />
      <rect x="140" y="50" width="52" height="24" rx="12" />

      <!-- Main Smooth Car Shell -->
      <path d="M 0 -58 
               C 62 -58, 116 -36, 150 4 
               C 165 20, 178 38, 192 52 
               C 200 58, 212 72, 212 108 
               C 212 134, 200 154, 180 162 
               L 160 162 
               C 160 176, 152 186, 140 186 
               L 104 186 
               C 92 186, 84 176, 84 162 
               L -84 162 
               C -84 176, -92 186, -104 186 
               L -140 186 
               C -152 186, -160 176, -160 162 
               L -180 162 
               C -200 154, -212 134, -212 108 
               C -212 72, -200 58, -192 52 
               C -178 38, -165 20, -150 4 
               C -116 -36, -62 -58, 0 -58 Z" />
    </g>

    <!-- CAR CUTOUTS (Negative Space in #0075FF) -->
    <g fill="#0075FF" transform="translate(0, -210)">
      <!-- Windshield -->
      <path d="M 0 -36 
               C 54 -36, 96 -22, 118 4 
               C 128 18, 130 32, 138 46 
               C 138 54, 130 56, 120 56 
               L -120 56 
               C -130 56, -138 54, -138 46 
               C -130 32, -128 18, -118 4 
               C -96 -22, -54 -36, 0 -36 Z" />

      <!-- Left Headlight -->
      <path d="M -180 96 
               C -168 86, -134 86, -114 96 
               C -112 104, -122 116, -136 120 
               C -160 124, -180 116, -180 96 Z" />

      <!-- Right Headlight -->
      <path d="M 180 96 
               C 168 86, 134 86, 114 96 
               C 112 104, 122 116, 136 120 
               C 160 124, 180 116, 180 96 Z" />

      <!-- Center Lower Grille Cutout -->
      <path d="M -74 116 
               L 74 116 
               C 82 116, 84 121, 82 126 
               L 68 152 
               C 62 162, 52 168, 40 168 
               L -40 168 
               C -52 168, -62 162, -68 152 
               L -82 126 
               C -84 121, -82 116, -74 116 Z" />
    </g>

    <!-- TYPOGRAPHY -->
    <text x="0" y="110" text-anchor="middle" class="title-text">Auto Parts</text>
    <text x="13" y="182" text-anchor="middle" class="india-text">INDIA</text>
  </g>

  <!-- BOTTOM TAGLINE -->
  <text x="540" y="2120" text-anchor="middle" class="tagline-text">India’s leading auto parts marketplace</text>
</svg>