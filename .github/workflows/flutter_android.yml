name: Build Flutter Android APK & AAB

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-flutter-apk:
    name: Build Flutter Android App (APK & AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Free Disk Space on GitHub Runner
        run: |
          echo "=== Initial Disk Space ==="
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/share/swift || true
          sudo docker image prune --all --force 2>/dev/null || true
          echo "=== Disk Space After Cleanup ==="
          df -h

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Print Flutter & Dart Version
        run: |
          flutter --version
          dart --version
          flutter precache --android

      - name: Ensure Android Keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p flutter_app/android/app
          cp ~/.android/debug.keystore flutter_app/android/app/debug.keystore || true

      - name: Ensure Android google-services.json
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p flutter_app/android/app
          if [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
            echo "Using google-services.json from GitHub Secrets..."
            echo "$GOOGLE_SERVICES_JSON_SECRET" > flutter_app/android/app/google-services.json
          elif [ ! -f "flutter_app/android/app/google-services.json" ]; then
            echo "Embedding project google-services.json..."
            cat << 'EOF' > flutter_app/android/app/google-services.json
          {
            "project_info": {
              "project_number": "751764116522",
              "firebase_url": "https://auto-parts-market-place-20312-default-rtdb.firebaseio.com",
              "project_id": "auto-parts-market-place-20312",
              "storage_bucket": "auto-parts-market-place-20312.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:751764116522:android:f4705ee3aed7aa197adf53",
                  "android_client_info": {
                    "package_name": "com.autoparts.marketplace"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "751764116522-oc4lurqs2fflbr5fdanlq32343if1e5k.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.autoparts.marketplace",
                      "certificate_hash": "14d6a60e48069f67ccfaa47241797b95d9b5689a"
                    }
                  },
                  {
                    "client_id": "751764116522-gr59kobj3c3i1hsgr5hiumauk5otr5sq.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyBTfivYbxE7PDB7FxyAlJjFDid6LKPplx8"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "751764116522-gr59kobj3c3i1hsgr5hiumauk5otr5sq.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Ensure Gradle Wrapper & Properties
        run: |
          mkdir -p flutter_app/android/gradle/wrapper
          cat << 'EOF' > flutter_app/android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          cat << 'EOF' > flutter_app/android/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.vfs.watch=false
          android.useAndroidX=true
          android.enableJetifier=false
          android.defaults.buildfeatures.buildconfig=true
          android.skipBuildDependencyValidation=true
          android.newDsl=false
          android.builtInKotlin=false
          android.suppressUnsupportedCompileSdk=36
          EOF
          mkdir -p ~/.gradle
          cp flutter_app/android/gradle.properties ~/.gradle/gradle.properties || true
          
          # Setup local.properties with correct flutter.sdk
          FLUTTER_SDK_DIR=$(which flutter | sed 's|/bin/flutter||')
          echo "flutter.sdk=$FLUTTER_SDK_DIR" > flutter_app/android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> flutter_app/android/local.properties

      - name: Install Flutter Dependencies
        run: |
          cd flutter_app
          flutter clean
          flutter pub get

      - name: Build Android Universal Release APK
        env:
          GRADLE_OPTS: "-Dandroid.newDsl=false -Dandroid.builtInKotlin=false -Dandroid.skipBuildDependencyValidation=true -Dandroid.suppressUnsupportedCompileSdk=36"
        run: |
          cd flutter_app
          flutter build apk --release --verbose --no-tree-shake-icons --android-skip-build-dependency-validation
          mkdir -p build/app/outputs/flutter-apk
          find build -name "*release*.apk" -exec cp {} build/app/outputs/flutter-apk/ \; || true
          find build -name "*.apk" -exec cp {} build/app/outputs/flutter-apk/ \; || true
          echo "=== Built APK Files ==="
          ls -lah build/app/outputs/flutter-apk/

      - name: Build Google Play App Bundle (AAB)
        env:
          GRADLE_OPTS: "-Dandroid.newDsl=false -Dandroid.builtInKotlin=false -Dandroid.skipBuildDependencyValidation=true -Dandroid.suppressUnsupportedCompileSdk=36"
        run: |
          cd flutter_app
          flutter build appbundle --release --verbose --no-tree-shake-icons --android-skip-build-dependency-validation || true
          mkdir -p build/app/outputs/bundle/release
          find build -name "*release*.aab" -exec cp {} build/app/outputs/bundle/release/ \; || true
          find build -name "*.aab" -exec cp {} build/app/outputs/bundle/release/ \; || true
          echo "=== Built AAB Files ==="
          ls -lah build/app/outputs/bundle/release/

      - name: Upload Flutter APKs to GitHub Artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: flutter-android-apks
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 1

      - name: Upload Google Play AAB to GitHub Artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: flutter-android-bundle-aab
          path: flutter_app/build/app/outputs/bundle/release/*.aab
          retention-days: 1

      - name: Publish Release APK & AAB to GitHub Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "Auto Parts Marketplace v1.0.0 (Release APK & AAB)"
          body: |
            ## 🚀 Auto Parts Marketplace Release v1.0.0
            
            Android release binaries:
            - **app-release.apk**: Universal Android APK (Install directly on any Android device)
            - **app-release.aab**: Google Play Store Bundle
            
            *Compiled with Android SDK 35, Kotlin 2.2.20, Gradle 8.11.1, AGP 8.11.1*
          draft: false
          prerelease: false
          files: |
            flutter_app/build/app/outputs/flutter-apk/*.apk
            flutter_app/build/app/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
